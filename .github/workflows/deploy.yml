name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Esegui Test di Integrità e Schema
        run: npm test

      - name: Quality Gate (Fail Closed)
        run: node scripts/quality-gate.mjs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Applicazione Vite
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/osservatorio-bandi-re/' }}
        run: npm run build

      - name: Carica Artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
