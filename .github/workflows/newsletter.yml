name: Generazione Newsletter Settimanale & Feed RSS

on:
  schedule:
    # Pianificato ogni lunedì alle ore 06:15 Europe/Rome con gestione automatica CET/CEST
    - cron: '15 6 * * 1'
      timezone: 'Europe/Rome'
  workflow_dispatch:
    inputs:
      week_override:
        description: 'Settimana specifica (es. 2026-W44, facoltativo)'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Verifica Quality Gate (Fail Closed)
        run: node scripts/quality-gate.mjs

      - name: Genera Newsletter e Feed RSS
        run: |
          if [ -n "${{ github.event.inputs.week_override }}" ]; then
            node scripts/generate-newsletter.mjs --week "${{ github.event.inputs.week_override }}"
          else
            node scripts/generate-newsletter.mjs
          fi

      - name: Test validazione Feed RSS generato
        run: npx vitest run tests/newsletter-rss.test.ts

      - name: Sincronizzazione sicura e Push Newsletter ed Edizioni
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/newsletter/ public/data/weekly/
          if git diff --staged --quiet; then
            echo "Nessun cambiamento nei file di newsletter da committare."
          else
            git commit -m "chore(newsletter): emissione settimanale $(date +'%Y-W%V') [skip ci]"
            for attempt in 1 2 3; do
              echo "Tentativo di push $attempt di 3..."
              git fetch origin main
              if git push origin main; then
                echo "SUCCESS: Commit e push completati con successo su origin/main!"
                break
              fi
              echo "Push respinto (possibile commit concorrente su remoto). Eseguo rebase..."
              git pull --rebase origin main || true
              sleep 3
              if [ "$attempt" -eq 3 ]; then
                echo "ERRORE CRITICO: Push non riuscito dopo 3 tentativi."
                exit 1
              fi
            done
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Applicazione Vite
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/osservatorio-bandi-re/' }}
        run: npm run build

      - name: Carica Artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
